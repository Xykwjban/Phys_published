<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Физика — учебные материалы</title>
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 860px; margin: 3rem auto; padding: 0 1.2rem; font: 1rem/1.6 system-ui, sans-serif; }
    h1 { line-height: 1.2; }
    li { margin: .7rem 0; }
    code { overflow-wrap: anywhere; }
    .note { opacity: .75; }
  </style>
</head>
<body>
  <h1>Учебные материалы по физике</h1>
  <p class="note">Публичная библиотека готовых конспектов и заданий. PDF открываются в браузере.</p>
  <h2>Документы</h2>
  <ul id="documents">
    <li>Каталог документов будет обновляться автоматически после первой публикации.</li>
  </ul>
  <script>
    const owner = "Xykwjban";
    const repo = "Phys_published";
    const list = document.getElementById("documents");
    fetch(`https://api.github.com/repos/${owner}/${repo}/contents/pdf`)
      .then(r => {
        if (!r.ok) throw new Error("Не удалось загрузить список PDF");
        return r.json();
      })
      .then(files => {
        const pdfs = files.filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".pdf"))
          .sort((a, b) => b.name.localeCompare(a.name));
        list.replaceChildren();
        if (!pdfs.length) {
          list.innerHTML = "<li>Пока нет опубликованных PDF.</li>";
          return;
        }
        for (const file of pdfs) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.href = file.download_url;
          a.textContent = file.name.replace(/\.pdf$/i, "").replace(/[-_]/g, " ");
          a.target = "_blank";
          a.rel = "noopener";
          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(() => {
        list.innerHTML = "<li>Не удалось получить список документов. Откройте каталог <a href='pdf/'>PDF</a> вручную.</li>";
      });
  </script>
</body>
</html>
